name: Weekly Digest

on:
  schedule:
    # Every 15 minutes so each user's local Sunday + digest_time window can match
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        run: |
          curl -X POST "${{ secrets.DOMINO_API_URL }}/api/v1/digest/trigger" \
            -H "X-Internal-Secret: ${{ secrets.DOMINO_INTERNAL_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail
